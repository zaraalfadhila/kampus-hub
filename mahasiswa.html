<html lang="id">

<head>

    <meta

    <title>Mahasiswa | KampusHub</title>

<body>

<div class="container">

    <header>

        <h1>KampusHub</h1>

        <p>
            Pusat informasi mahasiswa Universitas Wahidiyah
        </p>
    </header>

    <nav>
        <span>NAV</span>

        <a href="pengumuman.html">Pengumuman</a>
        <a href="tentang.html">Tentang</a>

    <main>
        <span class="label">DATA AKADEMIK</span>

        <h2>Data Mahasiswa</h2>

        <p>
            Cari nama mahasiswa untuk melihat informasi
            akademik.
        </p>

        <form id="formPencarian">

            <label for="q">
                Nama Mahasiswa
            </label>

            <input
                type="text"
                id="q"
                name="q"
                placeholder="Ketik nama mahasiswa..."
                autocomplete="off"
            >

            <button type="submit">
                Cari
            </button>

            <div id="saran"></div>

        </form>
    </main>

    <section id="Daftar-Mahasiswa">

        <span class="label">
            HASIL PENCARIAN
        </span>

    </section>

    <footer>

        <span class="label">
